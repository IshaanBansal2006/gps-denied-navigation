[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gps_denied_nav"
version = "0.1.0"
description = "Neural-aided IMU navigation for GPS-denied UAV flight (EuRoC MAV reference implementation)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Ishaan Bansal", email = "ishaanbansal2006@gmail.com"}]
keywords = ["robotics", "navigation", "imu", "kalman-filter", "lstm", "drone", "uav", "gps-denied"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=1.5",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "pillow>=10.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/IshaanBansal2006/gps-denied-navigation"
Repository = "https://github.com/IshaanBansal2006/gps-denied-navigation"

[tool.setuptools.packages.find]
include = ["gps_denied_nav*"]
exclude = ["scripts*", "tests*", "docs*", "data*", "checkpoints*", "results*", "logs*"]
