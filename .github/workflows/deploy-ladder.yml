name: Deploy ladder

# Comprehensive deployability check — runs on a brand-new Ubuntu VM with
# zero history, simulating what an outside user / fresh CI machine sees.
# Trigger manually with `gh workflow run "Deploy ladder"` or by pushing
# to a `test/**` branch.

on:
  workflow_dispatch:
  push:
    branches: ['test/**']

jobs:
  ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Bootstrap — install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: 1a — editable install
        id: editable
        continue-on-error: true
        run: pip install -e ".[dev]"

      - name: 1b — pytest
        id: pytest
        continue-on-error: true
        run: pytest tests/ -v --tb=short

      - name: 1c — mypy
        id: mypy
        continue-on-error: true
        run: |
          pip install mypy
          mypy --ignore-missing-imports gps_denied_nav/

      - name: 2a — build wheel + sdist
        id: build
        continue-on-error: true
        run: |
          pip install --upgrade build
          python -m build
          ls -la dist/

      - name: 2b — install wheel into fresh venv
        id: fresh_install
        continue-on-error: true
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --upgrade pip
          /tmp/v/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/v/bin/pip install dist/gps_denied_nav-*.whl

      - name: 2c — public API imports from installed wheel
        id: api_smoke
        continue-on-error: true
        run: |
          /tmp/v/bin/python - <<'PY'
          from gps_denied_nav import NavPipeline, EuRoCSequence, OutageEvaluator
          from gps_denied_nav.models import load_lstm_checkpoint
          from gps_denied_nav.adaptation import RLSHead
          from gps_denied_nav.filters import VelocityOnlyFilter
          print("public API imports OK")
          for name, obj in [
              ("NavPipeline", NavPipeline),
              ("EuRoCSequence", EuRoCSequence),
              ("OutageEvaluator", OutageEvaluator),
              ("load_lstm_checkpoint", load_lstm_checkpoint),
              ("RLSHead", RLSHead),
              ("VelocityOnlyFilter", VelocityOnlyFilter),
          ]:
              print(f"  {name}: {obj}")
          PY

      - name: 3 — figure scripts (committed result JSONs only)
        id: figures
        continue-on-error: true
        run: |
          pip install matplotlib pillow
          fail=0
          for fig in make_architecture_diagram make_hero_figure make_baseline_comparison_figure make_loss_curves_figure; do
            echo "=== $fig ==="
            if ! python3 "scripts/$fig.py"; then
              echo "FAILED: $fig"
              fail=$((fail+1))
            fi
          done
          exit $fail

      - name: 4 — execute notebook headless (Colab demo)
        id: notebook
        continue-on-error: true
        run: |
          pip install jupyter nbconvert ipykernel
          jupyter nbconvert --to notebook --execute notebooks/demo.ipynb \
            --output /tmp/demo_executed.ipynb \
            --ExecutePreprocessor.timeout=600

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy ladder — clean-room results"
            echo ""
            echo "Brand-new Ubuntu VM, Python 3.11, CPU torch."
            echo ""
            echo "| # | Step | Outcome |"
            echo "|---|---|---|"
            echo "| 1a | editable install | ${{ steps.editable.outcome }} |"
            echo "| 1b | pytest (23 unit tests) | ${{ steps.pytest.outcome }} |"
            echo "| 1c | mypy type-check | ${{ steps.mypy.outcome }} |"
            echo "| 2a | build wheel + sdist | ${{ steps.build.outcome }} |"
            echo "| 2b | install wheel in fresh venv | ${{ steps.fresh_install.outcome }} |"
            echo "| 2c | public API imports | ${{ steps.api_smoke.outcome }} |"
            echo "| 3 | figure scripts (4×) | ${{ steps.figures.outcome }} |"
            echo "| 4 | notebook execution | ${{ steps.notebook.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          for o in \
              '${{ steps.editable.outcome }}' \
              '${{ steps.pytest.outcome }}' \
              '${{ steps.mypy.outcome }}' \
              '${{ steps.build.outcome }}' \
              '${{ steps.fresh_install.outcome }}' \
              '${{ steps.api_smoke.outcome }}' \
              '${{ steps.figures.outcome }}' \
              '${{ steps.notebook.outcome }}'; do
            if [[ "$o" != "success" ]]; then fail=$((fail+1)); fi
          done

          if [[ $fail -gt 0 ]]; then
            echo "::error::$fail ladder rung(s) failed — see summary."
            exit 1
          fi
          echo "All 8 ladder rungs passed."
